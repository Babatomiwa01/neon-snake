<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Snake</title>
<style>
:root{--bg:#0a0a1a;--panel:#12122e;--fg:#39ff88;--accent:#ff3df2;--gold:#ffe14d;--dim:#3a3a6a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#1a1030;--panel:#241a45}}
:root[data-theme="dark"]{--bg:#0a0a1a;--panel:#12122e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:"Press Start 2P","Courier New",monospace;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{margin:0;font-size:clamp(16px,5vw,26px);color:var(--accent);text-shadow:0 0 8px var(--accent),3px 3px 0 #000;letter-spacing:2px}
.hud{display:flex;justify-content:space-between;width:min(92vw,420px);font-size:11px;text-shadow:0 0 6px var(--fg)}
.wrap{position:relative;width:min(92vw,420px);aspect-ratio:1;border:4px solid var(--fg);box-shadow:0 0 20px var(--fg),inset 0 0 20px #000;border-radius:6px;overflow:hidden;background:#000}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:rgba(0,0,10,.75);z-index:2;font-size:12px;line-height:1.8;cursor:pointer}
#msg b{color:var(--gold);font-size:18px;text-shadow:0 0 10px var(--gold)}
.blink{animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:0}}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px}
.pad button{background:var(--panel);color:var(--fg);border:2px solid var(--dim);border-radius:8px;font-size:20px;font-family:inherit}
.pad button:active{background:var(--fg);color:#000}
.pad .u{grid-column:2}.pad .l{grid-row:2;grid-column:1}.pad .d{grid-row:2;grid-column:2}.pad .r{grid-row:2;grid-column:3}
small{font-size:8px;color:var(--dim);color:#8a8ad0}
</style>
</head>
<body>
<h1>NEON SNAKE</h1>
<div class="hud"><span>SCORE <span id="sc">0</span></span><span>HI <span id="hi">0</span></span></div>
<div class="wrap">
<canvas id="c" width="400" height="400"></canvas>
<div id="msg"><b>NEON SNAKE</b><div>Eat <span style="color:var(--accent)">●</span> for points<br>Grab <span style="color:var(--gold)">★</span> for a bonus<br>Don't hit yourself!</div><div class="blink">TAP / PRESS SPACE</div></div>
</div>
<div class="pad">
<button class="u" data-d="u">▲</button><button class="l" data-d="l">◀</button><button class="d" data-d="d">▼</button><button class="r" data-d="r">▶</button>
</div>
<small>ARROWS / WASD / SWIPE · SPACE = PAUSE</small>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),N=20,S=20;
const $=id=>document.getElementById(id),msg=$('msg');
let snake,dir,next,food,star,score,speed,state='menu',last=0,acc=0,parts=[],hi=0;
try{hi=+localStorage.getItem('neonSnakeHi')||0}catch(e){}
$('hi').textContent=hi;
const V={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
let ac;
function beep(f,t=.08,type='square'){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f;v.gain.value=.05;
o.connect(v);v.connect(ac.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t);o.stop(ac.currentTime+t)}catch(e){}}
function free(){let p;do{p={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(s=>s.x==p.x&&s.y==p.y)||(food&&food.x==p.x&&food.y==p.y));return p}
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=next=V.r;food=null;food=free();star=null;score=0;speed=130;parts=[];$('sc').textContent=0}
function start(){reset();state='play';msg.style.display='none';beep(440,.1)}
function over(){state='over';beep(110,.5,'sawtooth');
if(score>hi){hi=score;$('hi').textContent=hi;try{localStorage.setItem('neonSnakeHi',hi)}catch(e){}}
msg.innerHTML='<b style="color:var(--accent)">GAME OVER</b><div>SCORE '+score+'<br>HI '+hi+'</div><div class="blink">TAP / PRESS SPACE</div>';msg.style.display='flex'}
function burst(x,y,c){for(let i=0;i<14;i++)parts.push({x:x*S+10,y:y*S+10,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,l:1,c})}
function turn(k){const d=V[k];if(d&&!(d[0]==-dir[0]&&d[1]==-dir[1]))next=d}
function step(){
dir=next;const h={x:(snake[0].x+dir[0]+N)%N,y:(snake[0].y+dir[1]+N)%N};
if(snake.some(s=>s.x==h.x&&s.y==h.y))return over();
snake.unshift(h);let ate=false;
if(h.x==food.x&&h.y==food.y){ate=true;score+=10;burst(h.x,h.y,'#ff3df2');beep(660);food=free();speed=Math.max(60,speed-3);
if(!star&&Math.random()<.3)star={...free(),t:60}}
else if(star&&h.x==star.x&&h.y==star.y){ate=true;score+=50;burst(h.x,h.y,'#ffe14d');beep(880,.2);star=null}
if(!ate)snake.pop();
if(star&&--star.t<=0)star=null;
$('sc').textContent=score}
function draw(){
g.fillStyle='#000';g.fillRect(0,0,400,400);
g.strokeStyle='#0d1a2a';g.lineWidth=1;
for(let i=0;i<=N;i++){g.beginPath();g.moveTo(i*S,0);g.lineTo(i*S,400);g.moveTo(0,i*S);g.lineTo(400,i*S);g.stroke()}
if(!snake)return;
g.shadowBlur=12;
g.shadowColor='#ff3df2';g.fillStyle='#ff3df2';g.beginPath();g.arc(food.x*S+10,food.y*S+10,7,0,7);g.fill();
if(star){g.shadowColor=g.fillStyle='#ffe14d';g.font='18px monospace';g.textAlign='center';g.textBaseline='middle';
if(star.t>20||star.t%4>1)g.fillText('★',star.x*S+10,star.y*S+11)}
g.shadowColor='#39ff88';
snake.forEach((s,i)=>{g.fillStyle=i?`hsl(${140-i*2},100%,${55-Math.min(i,20)}%)`:'#b6ffd6';g.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)});
const h=snake[0];g.fillStyle='#000';g.shadowBlur=0;
g.fillRect(h.x*S+5+dir[0]*3,h.y*S+5+dir[1]*3,3,3);g.fillRect(h.x*S+12+dir[0]*3,h.y*S+12+dir[1]*3,3,3);
parts.forEach(p=>{g.globalAlpha=Math.max(p.l,0);g.fillStyle=p.c;g.fillRect(p.x,p.y,3,3);p.x+=p.vx;p.y+=p.vy;p.l-=.04});
g.globalAlpha=1;parts=parts.filter(p=>p.l>0)}
function loop(t){const dt=t-last;last=t;
if(state=='play'){acc+=dt;while(acc>=speed&&state=='play'){acc-=speed;step()}}
draw();requestAnimationFrame(loop)}
function action(){if(state=='menu'||state=='over')start();else if(state=='play'){state='pause';msg.innerHTML='<b>PAUSED</b><div class="blink">TAP / PRESS SPACE</div>';msg.style.display='flex'}else if(state=='pause'){state='play';msg.style.display='none'}}
addEventListener('keydown',e=>{const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r'}[e.key];
if(m){e.preventDefault();if(state=='play')turn(m)}else if(e.key==' '){e.preventDefault();action()}});
msg.addEventListener('click',action);
document.querySelectorAll('.pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();if(state=='play')turn(b.dataset.d)}));
let tx,ty;
cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
if(state=='play')turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))});
reset();state='menu';requestAnimationFrame(loop);
</script>
</body>
</html>
